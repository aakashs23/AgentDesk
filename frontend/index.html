<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>AgentDesk</title>
  </head>
  <body>
    <script>
      // Resolve the theme before first paint, so a dark surface never flashes
      // white on reload. Mirrors resolveTheme() in src/lib/theme.ts: an explicit
      // preference wins, otherwise the surface decides. Login is always light.
      try {
        var stored = JSON.parse(localStorage.getItem('agentdesk.session') || 'null')
        var preference = stored && stored.user && stored.user.theme_preference
        var productSurface = /^\/(agent|admin)/.test(location.pathname)
        var login = /^\/login/.test(location.pathname)
        if (!login && (preference === 'dark' || (preference !== 'light' && productSurface))) {
          document.documentElement.classList.add('dark')
        }
      } catch {
        /* no stored session — light is the right default */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
