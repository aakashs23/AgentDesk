<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>AgentDesk</title>
  </head>
  <body>
    <script>
      // Resolve the theme before first paint, so dark never flashes white on
      // reload. Mirrors resolveTheme() in src/lib/ui.ts: Doc 07 is light-first
      // everywhere, so only an explicit stored preference turns dark on.
      try {
        var stored = JSON.parse(localStorage.getItem('agentdesk.session') || 'null')
        var preference = stored && stored.user && stored.user.theme_preference
        if (preference === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch {
        /* no stored session — light is the right default */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
